server {
    listen 80;
    server_name dun.zenslab.top;
    location ^~ /.well-known/acme-challenge/ { root /srv/dundun-pupu/acme; }
    location / { return 301 https://dun.zenslab.top$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name dun.zenslab.top;
    ssl_certificate /etc/letsencrypt/live/dun.zenslab.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dun.zenslab.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/dundun-pupu/current/dist/client;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json;
    add_header X-Content-Type-Options nosniff always;
    location ^~ /.well-known/acme-challenge/ { root /srv/dundun-pupu/acme; }
    location ~ /\. { return 404; }
    location ^~ /_next/static/ {
        try_files $uri =404;
        expires 1y;
    }
    location ~* \.(webp|png|jpe?g|svg|gif|mp4|vtt|woff2?|ico)$ {
        try_files $uri =404;
        expires 1d;
    }
    location = /deploy-release.txt { add_header Cache-Control "no-store"; }
    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
