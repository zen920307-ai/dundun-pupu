<style>

  'arrow-up': '<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>',
  'arrow-down': '<line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>',
  'eye-off': '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>',
  eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  globe: '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
  activity: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  monitor: '<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>',
  layers: '<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
};
function iconSvg(name, size = 16) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name] || ''}</svg>`;
}
// 静态占位（data-icon）注入
document.querySelectorAll('[data-icon]').forEach((el) => {
  el.innerHTML = iconSvg(el.dataset.icon, Number(el.dataset.size || 16));
});

const MODULE_META = {
  kv:         { icon: 'image',      desc: '首页巨幕主视觉，改完发布即上线' },
  wallpapers: { icon: 'smartphone', desc: '手机壁纸库，访客可以打包带走' },
  festivals:  { icon: 'layers',     desc: '可爱设计 / 节日图库' },
  emoji:      { icon: 'smile',      desc: '表情包预备模块，随时开工' },
  travel:     { icon: 'send',       desc: '出逃档案：海报 + 日记 + 损友小剧场' },
};
const state = { schema: null, module: 'kv', items: [], editing: null, form: {}, dirty: false };
const $ = (id) => document.getElementById(id);

let toastTimer;
function toast(msg, ms = 3200) {
  const el = $('pubBar');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

function markDirty() {
  state.dirty = true;
  $('publishBtn').classList.add('dirty');
}

async function api(pathname, opts) {
  const res = await fetch(pathname, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.ok === false) throw new Error(data.error || res.statusText);
  return data;
}

// ---------- 初始化 / 切换模块 ----------
async function init() {
  const { schema } = await api('/api/schema');
  state.schema = schema;
  const tabs = $('tabs');
  for (const [key, mod] of Object.entries(schema)) {
    const b = document.createElement('button');
    b.dataset.m = key;
    b.innerHTML = `<span class="ico">${iconSvg(MODULE_META[key]?.icon || 'image', 16)}</span><span>${mod.label}</span><span class="cnt"></span>`;
    b.onclick = () => switchModule(key);
    tabs.appendChild(b);
  }
  await switchModule('kv');
}

async function switchModule(m) {
  state.module = m;
  closeDrawer();
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('active', b.dataset.m === m));
  const { items } = await api('/api/data?module=' + m);
  state.items = items;
  updateChrome();
  render();
}

function updateChrome() {
  const schema = state.schema[state.module];
  const meta = MODULE_META[state.module] || {};
  $('modIcon').innerHTML = iconSvg(meta.icon || 'image', 18);
  $('modTitle').textContent = schema.label;
  $('modSub').textContent = meta.desc || '';
  document.querySelectorAll('#tabs button').forEach((b) => {
    b.querySelector('.cnt').textContent = state.items.length;
  });
}

// ---------- 列表渲染 ----------
function coverOf(it) {
  if (it.posterThumb || it.thumb || it.poster || it.src) return it.posterThumb || it.thumb || it.poster || it.src;
  if (it.place) return '/travel/' + it.place + '-thumb.webp';
  return '';
}
const titleOf = (it) => it.title || it.place || '（未命名）';
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

function render() {
  const q = $('search').value.trim().toLowerCase();
  const shown = state.items.filter((it) => {
    if (!q) return true;
    return [it.title, it.tag, it.place, it.date].some((v) => typeof v === 'string' && v.toLowerCase().includes(q));
  });

  const grid = $('grid');
  grid.innerHTML = '';
  const isEmpty = shown.length === 0;
  $('empty').style.display = isEmpty ? 'block' : 'none';
  grid.style.display = isEmpty ? 'none' : '';
  if (isEmpty) {
    $('emptyText').textContent = state.items.length
      ? '没有匹配的内容，换个词试试'
      : '这里还空空如也，两小只等着开工';
    return;
  }

  shown.forEach((item, visIdx) => {
    const realIdx = state.items.indexOf(item);
    const card = document.createElement('article');
    card.className = 'card' + (item.hidden ? ' hidden-card' : '');
    card.style.animationDelay = Math.min(visIdx * 0.03, 0.4) + 's';
    const cover = coverOf(item);
    card.innerHTML = `
      <div class="cover">
        ${cover ? `<img src="${esc(cover)}" alt="" loading="lazy" />` : ''}
        ${item.hidden ? '<span class="badge off">已下架</span>' : `<span class="badge">#${String(realIdx + 1).padStart(2, '0')}</span>`}
      </div>
      <div class="card-body">
        <h3></h3>
        <div class="card-meta"></div>
      </div>
      <div class="ops">
        <button class="primary" data-act="edit"><span class="ico">${iconSvg('edit', 13)}</span>编辑</button>
        <button class="sq" data-act="up" title="前移一位"><span class="ico">${iconSvg('arrow-up', 13)}</span></button>
        <button class="sq" data-act="down" title="后移一位"><span class="ico">${iconSvg('arrow-down', 13)}</span></button>
        <button class="toggle" data-act="toggle" title="${item.hidden ? '重新上架' : '下架（前端隐藏）'}"><span class="ico">${iconSvg(item.hidden ? 'eye' : 'eye-off', 13)}</span>${item.hidden ? '上架' : '下架'}</button>
        <button class="sq danger" data-act="del" title="删除"><span class="ico">${iconSvg('trash', 13)}</span></button>
      </div>`;
    card.querySelector('h3').textContent = titleOf(item);
    const meta = card.querySelector('.card-meta');
    for (const text of [item.tag, item.date].filter(Boolean)) {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = text;
      meta.appendChild(chip);
    }
    if (item.mode) {
      const chip = document.createElement('span');
      chip.className = 'chip plain';
      chip.textContent = item.mode;
      meta.appendChild(chip);
    }
    card.querySelector('[data-act=edit]').onclick = () => openDrawer(realIdx);
    card.querySelector('[data-act=up]').onclick = () => move(realIdx, -1);
    card.querySelector('[data-act=down]').onclick = () => move(realIdx, 1);
    card.querySelector('[data-act=toggle]').onclick = () => toggleHidden(realIdx);
    card.querySelector('[data-act=del]').onclick = () => remove(realIdx);
    grid.appendChild(card);
  });
}

async function persist() {
  await api('/api/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ module: state.module, items: state.items }),
  });
  markDirty();
}

async function move(idx, dir) {
  const j = idx + dir;
  if (j < 0 || j >= state.items.length) return;
  [state.items[idx], state.items[j]] = [state.items[j], state.items[idx]];
  await persist();
  render();
}

async function toggleHidden(idx) {
  if (state.items[idx].hidden) delete state.items[idx].hidden;
  else state.items[idx].hidden = true;
  await persist();
  render();
}

async function remove(idx) {
  const item = state.items[idx];
  if (!confirm(`确定删除「${titleOf(item)}」？\n（删除只是本地移除，发布前随时可关页面反悔）`)) return;
  state.items.splice(idx, 1);
  await persist();
  updateChrome();
  render();
  toast('已删除。点右上「保存并发布」后才会上线');
}

// ---------- 编辑抽屉 ----------
function nextId() {
  const mod = state.schema[state.module];
  let n = state.items.length + 1;
  const ids = new Set(state.items.map((i) => i.id));
  while (ids.has(`${mod.prefix}-${String(n).padStart(2, '0')}`)) n++;
  return `${mod.prefix}-${String(n).padStart(2, '0')}`;
}

// 给表单字段赋值并同步到界面（上传自动填充用）
function setFormValue(key, value) {
  state.form[key] = value;
  const input = $('form').querySelector(`[data-fkey="${key}"]`);
  if (input) {
    input.value = value;
    const box = input.closest('.image-field');
    if (box) {
      const img = box.querySelector('.thumb');
      img.style.display = value ? '' : 'none';
      img.src = value;
    }
  }
  renderPreview();
}

function openDrawer(idx) {
  state.editing = idx; // null = 新增
  const mod = state.schema[state.module];
  const item = idx == null ? {} : state.items[idx];
  state.form = {};
  const form = $('form');
  form.innerHTML = '';

  // 前端效果预览（置顶）
  const pv = document.createElement('div');
  pv.className = 'pv';
  pv.id = 'pv';
  pv.innerHTML = `
    <div class="pv-head"><span class="ico">${iconSvg('monitor', 14)}</span>前端效果预览<em>随填写实时更新 · 发布后线上即此效果</em></div>
    <div id="pvBody"></div>`;
  form.appendChild(pv);

  for (const f of mod.fields) {
    const v = item[f.key];
    state.form[f.key] = Array.isArray(v) ? v.join('\n') : v == null ? '' : String(v);
    if (f.auto) continue; // 自动生成字段（缩略图/原图/宽高）不显示，保存时照常带上
    const wrap = document.createElement('div');
    wrap.className = 'field';
    const label = document.createElement('label');
    label.textContent = f.label;
    wrap.appendChild(label);
    if (f.type === 'textarea') {
      const ta = document.createElement('textarea');
      ta.rows = f.key === 'story' ? 7 : 5;
      ta.value = state.form[f.key];
      ta.dataset.fkey = f.key;
      ta.oninput = () => { state.form[f.key] = ta.value; renderPreview(); };
      wrap.appendChild(ta);
    } else if (f.type === 'image') {
      const box = document.createElement('div');
      box.className = 'image-field';
      const img = document.createElement('img');
      img.className = 'thumb';
      img.style.display = state.form[f.key] ? '' : 'none';
      if (state.form[f.key]) img.src = state.form[f.key];
      const input = document.createElement('input');
      input.placeholder = '上传一张图，其余格式自动生成；也可直接粘贴图片地址';
      input.value = state.form[f.key];
      input.dataset.fkey = f.key;
      input.oninput = () => { state.form[f.key] = input.value; img.style.display = input.value ? '' : 'none'; img.src = input.value; renderPreview(); };
      const btn = document.createElement('button');
      btn.innerHTML = `<span class="ico">${iconSvg('upload', 13)}</span>上传`;
      btn.onclick = () => pickFile(img, input);
      box.append(img, input, btn);
      wrap.appendChild(box);
      // 自动生成说明
      if (state.module === 'travel' && (f.key === 'poster' || f.key === 'posterThumb')) {
        const note = document.createElement('div');
        note.className = 'auto-note';
        note.textContent = f.key === 'poster' ? '上传一次 → 自动生成完整海报 + 缩略图，两项都会填好' : '不用单独传，上传「完整海报」时已自动生成';
        wrap.appendChild(note);
      } else if (f.key === 'src') {
        const note = document.createElement('div');
        note.className = 'auto-note';
        note.textContent = '上传一次 → 自动生成展示图 + 缩略图（+ 原图下载），全部自动填好';
        wrap.appendChild(note);
      }
    } else {
      const input = document.createElement('input');
      input.type = f.type === 'number' ? 'number' : 'text';
      if (idx == null && f.key === 'id' && state.module === 'travel') input.placeholder = '如 iceland（页面锚点用）';
      input.value = state.form[f.key];
      input.dataset.fkey = f.key;
      input.oninput = () => { state.form[f.key] = input.value; renderPreview(); };
      wrap.appendChild(input);
    }
    form.appendChild(wrap);
  }
  if (idx == null && state.module !== 'travel') {
    state.form.id = nextId();
    if (!state.form.width) state.form.width = '1672';
    if (!state.form.height) state.form.height = '941';
  }
  $('drawerTitle').textContent = idx == null ? '新增 · ' + mod.label : '编辑 · ' + titleOf(item);
  $('overlay').classList.add('open');
  $('drawer').classList.add('open');
  renderPreview();
}

// ---------- 前端效果预览 ----------
function renderPreview() {
  const body = $('pvBody');
  if (!body) return;
  const f = state.form;
  const num = state.editing == null ? state.items.length + 1 : state.editing + 1;
  if (state.module === 'travel') {
    const poster = f.posterThumb || f.poster || (f.place ? '/travel/' + f.place + '-thumb.webp' : '');
    const story1 = (f.story || '').split('\n').map((s) => s.trim()).filter(Boolean)[0] || '';
    const talk1 = (f.talk || '').split('\n').map((s) => s.trim()).filter(Boolean)[0] || '';
    body.innerHTML = `
      <div class="pv-trip">
        ${poster ? `<img class="pv-poster" src="${esc(poster)}" alt="" />` : '<div class="pv-poster"></div>'}
        <div class="pv-trip-info">
          <div class="pv-trip-top">出逃档案 / ${String(num).padStart(2, '0')}${f.date ? ' · ' + esc(f.date) : ''}</div>
          <div class="pv-trip-title">${esc(f.title || f.place || '标题待填')}</div>
          <div class="pv-trip-route">${esc([f.route, f.mode].filter(Boolean).join(' · '))}</div>
          <div class="pv-chips">${f.tag ? `<span>${esc(f.tag)}</span>` : ''}${f.mode ? `<span class="plain">${esc(f.mode)}</span>` : ''}</div>
          ${story1 ? `<div class="pv-story">${esc(story1)}</div>` : '<div class="pv-none">日记还没写</div>'}
          ${talk1 ? `<div class="pv-talk">${esc(talk1)}</div>` : ''}
        </div>
      </div>`;
  } else {
    const img = f.src || f.thumb || '';
    body.innerHTML = `
      <div class="pv-cover">
        ${img ? `<img src="${esc(img)}" alt="" />` : ''}
        ${f.tag ? `<span class="pv-tag">${esc(f.tag)}</span>` : ''}
      </div>
      <div class="pv-title">${esc(f.title || '标题待填')}</div>
      <div class="pv-sub">${esc([f.tag, f.width && f.height ? `${f.width} × ${f.height}` : ''].filter(Boolean).join(' · ') || '图片上传后自动回填尺寸')}</div>`;
  }
}

// ---------- 上传：一张图自动生成全套格式 ----------
async function uploadToServer(file) {
  return api(`/api/upload?module=${state.module}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/octet-stream', 'X-File-Name': encodeURIComponent(file.name) },
    body: file,
  });
}

function pickFile(img, input) {
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'image/*';
  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    if (!file) return;
    toast('上传并生成格式中：' + file.name, 60000);
    try {
      const data = await uploadToServer(file);
      if (state.module === 'travel') {
        setFormValue('poster', data.main);
        if (data.thumb) setFormValue('posterThumb', data.thumb);
      } else {
        setFormValue('src', data.main);
        if (data.thumb) setFormValue('thumb', data.thumb);
        if (data.original) setFormValue('original', data.original);
        if (data.width) { setFormValue('width', String(data.width)); setFormValue('height', String(data.height)); }
      }
      toast(data.warning || '已自动生成全套格式，记得保存');
    } catch (e) {
      toast('上传失败：' + e.message, 8000);
    }
  };
  fileInput.click();
}

function closeDrawer() {
  state.editing = null;
  $('overlay').classList.remove('open');
  $('drawer').classList.remove('open');
}

async function save() {
  const mod = state.schema[state.module];
  const fields = {};
  for (const f of mod.fields) {
    const raw = state.form[f.key] ?? '';
    if (f.key === 'story' || f.key === 'talk') {
      fields[f.key] = raw.split('\n').map((s) => s.trim()).filter(Boolean);
    } else if (f.type === 'number') {
      fields[f.key] = Number(raw) || 0;
    } else {
      fields[f.key] = raw.trim();
    }
  }
  const idx = state.editing;
  if (idx == null) {
    state.items.push(fields);
  } else {
    const wasHidden = state.items[idx].hidden;
    state.items[idx] = { ...fields };
    if (wasHidden) state.items[idx].hidden = true;
  }
  await persist();
  updateChrome();
  render();
  closeDrawer();
  toast('已保存到本地。点「保存并发布」上线');
}

// ---------- 发布 ----------
async function publish() {
  const btn = $('publishBtn');
  btn.disabled = true;
  const lbl = btn.querySelector('.lbl');
  const old = lbl.textContent;
  lbl.textContent = '发布中…';
  try {
    const data = await api('/api/publish', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) });
    state.dirty = false;
    btn.classList.remove('dirty');
    toast('🚀 ' + (data.message || '已发布'), 7000);
  } catch (e) {
    toast('发布失败：' + e.message, 9000);
  } finally {
    btn.disabled = false;
    lbl.textContent = old;
  }
}

// ---------- 事件 ----------
$('search').oninput = render;
$('addBtn').onclick = () => openDrawer(null);
$('emptyAdd').onclick = () => openDrawer(null);
$('closeDrawer').onclick = closeDrawer;
$('overlay').onclick = closeDrawer;
$('cancelBtn').onclick = closeDrawer;
$('saveBtn').onclick = () => save().catch((e) => toast('保存失败：' + e.message));
$('publishBtn').onclick = () => publish();

init().catch((e) => {
  $('modTitle').textContent = '加载失败';
  $('modSub').textContent = e.message + '（本地服务是否已启动？）';
});
</script>
</body>
